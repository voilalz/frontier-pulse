name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages-deployment.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily classic papers", "Daily news update", "Full stream update", "Restore retained release", "Deepread recovery"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify trusted production event
        id: event_gate
        run: python scripts/deployment_gate.py
      - name: Check Cloudflare credentials
        if: steps.event_gate.outputs.deploy == 'true'
        shell: bash
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy public directory
        if: steps.event_gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=frontier-pulse --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
