name: Full stream update

on:
  push:
    branches:
      - main
    paths:
      - "scripts/event_identity.py"
      - "scripts/update_news.py"
      - "scripts/publication.py"
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontier-data-main
  queue: max
  cancel-in-progress: false

jobs:
  refresh-stream:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare isolated generation directory
        if: true
        run: python scripts/publication.py prepare --stage "$RUNNER_TEMP/frontier-stage"
      - name: Collect the qualified 24-hour stream
        id: collect
        continue-on-error: true
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: >-
          python scripts/update_news.py
          --output "$RUNNER_TEMP/frontier-stage/data/news.json"
          --events-output "$RUNNER_TEMP/frontier-stage/data/events.json"
          --source-health-output "$RUNNER_TEMP/frontier-stage/data/source-health.json"
          --stream-only
          --stream-output "$RUNNER_TEMP/frontier-stage/data/stream.json"
          --stream-status-output "$RUNNER_TEMP/frontier-stage/data/stream-status.json"
      - name: Validate staged publication
        id: validate
        if: steps.collect.outcome == 'success'
        run: python scripts/publication.py validate --mode stream --stage "$RUNNER_TEMP/frontier-stage"
      - name: Promote validated publication
        id: promote
        if: steps.validate.outcome == 'success'
        run: python scripts/publication.py promote --mode stream --stage "$RUNNER_TEMP/frontier-stage"
      - name: Record failed generation or validation
        if: always() && steps.promote.outcome != 'success'
        run: python scripts/publication.py fail --mode stream
      - name: Commit stream data and status
        id: publish
        if: always()
        env:
          PROMOTED: ${{ steps.promote.outcome }}
        run: |
          if [ "$PROMOTED" = success ]; then
            git add -A -- public/data/stream.json public/data/stream-status.json public/data/events.json public/data/source-health.json
          else
            git add -- public/data/stream-status.json
          fi
          if git diff --cached --quiet; then
            echo "No publication change"
            exit 0
          fi
          git config user.name "frontier-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): publish validated stream output or failure status"
          for attempt in 1 2 3; do
            git fetch origin main
            # Fail closed on conflicting generation; never force an old bundle over new data.
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            echo "main changed during push; retrying publication ($attempt/3)"
            sleep "$((attempt * 2))"
          done
          exit 1
      - name: Mark failed publication
        if: always() && (steps.promote.outcome != 'success' || steps.publish.outcome != 'success')
        run: |
          echo "The previous full stream was retained and stream-status.json records the failure."
          exit 1
