name: Daily news update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-news.yml"
      - "scripts/update_news.py"
      - "scripts/news_evidence.py"
      - "scripts/evidence_trace.py"
      - "scripts/event_identity.py"
      - "scripts/daily_deepread.py"
      - "scripts/deepread_editorial.py"
      - "scripts/deepread_editorial_signals.py"
      - "scripts/audit_sources.py"
      - "scripts/check_daily_refresh.py"
      - "scripts/publication.py"
      - "scripts/reader_quality.py"
      - "scripts/deepread_quality.py"
      - "scripts/deepread_topics.py"
      - "scripts/deepread_topic_quality.py"
      - "scripts/publication_clock.py"
      - "config/news_config.json"
      - "public/assets/news-policy.json"
  schedule:
    - cron: "40 7 * * *"
      timezone: "Asia/Shanghai"
    - cron: "10 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "当天尚无正式版本时重新生成"
        required: false
        default: false
        type: boolean
      revision_reason:
        description: "已发版本确需更正时填写原因，保留初版与差异"
        required: false
        default: ""
        type: string
      base_release_id:
        description: "更正所依据的当前发布版本 ID"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: frontier-data-main
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A queued job must start from the preceding publication's data.
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Decide whether today's edition needs refresh
        id: refresh_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
          REVISION_REASON: ${{ github.event.inputs.revision_reason || '' }}
        run: >-
          python scripts/check_daily_refresh.py
          --status public/data/status.json
          --release public/data/release.json
          --revision-reason "$REVISION_REASON"
          --deepread public/data/deepread.json
          --required-deepread-revision 13
          --timezone Asia/Shanghai
          --event-name "$EVENT_NAME"
          --force "$FORCE_REFRESH"
          --required-schema 11
          --required-summary-revision 5
          --require-history-analysis
          --github-output "$GITHUB_OUTPUT"
      - name: Run unit tests
        if: steps.refresh_gate.outputs.should_run == 'true'
        run: python tests/run_offline.py
      - name: Prepare isolated generation directory
        if: steps.refresh_gate.outputs.should_run == 'true'
        run: python scripts/publication.py prepare --stage "$RUNNER_TEMP/frontier-stage"
      - name: Collect, rank and summarize the latest 24 hours
        if: steps.refresh_gate.outputs.should_run == 'true'
        id: collect
        continue-on-error: true
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVISION_REASON: ${{ github.event.inputs.revision_reason || '' }}
        run: >-
          python scripts/update_news.py
          --output "$RUNNER_TEMP/frontier-stage/data/news.json"
          --archive-dir "$RUNNER_TEMP/frontier-stage/data/archive"
          --archive-index "$RUNNER_TEMP/frontier-stage/data/archive/index.json"
          --search-index "$RUNNER_TEMP/frontier-stage/data/archive/search-index.json"
          --status-output "$RUNNER_TEMP/frontier-stage/data/status.json"
          --stream-output "$RUNNER_TEMP/frontier-stage/data/stream.json"
          --stream-status-output "$RUNNER_TEMP/frontier-stage/data/stream-status.json"
          --events-output "$RUNNER_TEMP/frontier-stage/data/events.json"
          --weekly-output "$RUNNER_TEMP/frontier-stage/data/weekly.json"
          --weekly-dir "$RUNNER_TEMP/frontier-stage/data/weekly"
          --signals-output "$RUNNER_TEMP/frontier-stage/data/signals.json"
          --feed-output "$RUNNER_TEMP/frontier-stage/feed.xml"
          --revision-reason "$REVISION_REASON"
      - name: Validate staged publication
        id: validate
        if: steps.refresh_gate.outputs.should_run == 'true' && steps.collect.outcome == 'success'
        run: python scripts/publication.py validate --mode daily --stage "$RUNNER_TEMP/frontier-stage" --expected-date "${{ steps.refresh_gate.outputs.edition_date }}"
      - name: Promote validated publication
        id: promote
        if: steps.refresh_gate.outputs.should_run == 'true' && steps.validate.outcome == 'success'
        env:
          REVISION_REASON: ${{ github.event.inputs.revision_reason || '' }}
          BASE_RELEASE_ID: ${{ github.event.inputs.base_release_id || '' }}
        run: |
          python scripts/publication_clock.py --edition "${{ steps.refresh_gate.outputs.edition_date }}" --wait
          python scripts/publication.py promote --mode daily --stage "$RUNNER_TEMP/frontier-stage" --expected-date "${{ steps.refresh_gate.outputs.edition_date }}" --revision-reason "$REVISION_REASON" --base-release-id "$BASE_RELEASE_ID"
      - name: Record failed generation or validation
        if: always() && steps.refresh_gate.outputs.should_run == 'true' && steps.promote.outcome != 'success'
        run: python scripts/publication.py fail --mode daily --expected-date "${{ steps.refresh_gate.outputs.edition_date }}"
      - name: Commit edition, archive and public status
        id: publish
        if: always() && steps.refresh_gate.outputs.should_run == 'true'
        env:
          PROMOTED: ${{ steps.promote.outcome }}
        run: |
          if [ "$PROMOTED" = success ]; then
            git add -A -- public/data public/releases public/feed.xml
          else
            git add -- public/data/status.json
          fi
          if git diff --cached --quiet; then
            echo "No publication change"
            exit 0
          fi
          git config user.name "frontier-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): publish validated daily output or failure status"
          for attempt in 1 2 3; do
            git fetch origin main
            # Fail closed on conflicting generation; never force an old bundle over new data.
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            echo "main changed during push; retrying publication ($attempt/3)"
            sleep "$((attempt * 2))"
          done
          exit 1
      - name: Send administrator email digest
        if: steps.refresh_gate.outputs.should_run == 'true' && steps.promote.outcome == 'success' && steps.publish.outcome == 'success' && github.event_name != 'push'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/send_digest.py --input public/data/news.json
      - name: Mark failed publication
        if: always() && steps.refresh_gate.outputs.should_run == 'true' && (steps.promote.outcome != 'success' || steps.publish.outcome != 'success')
        run: |
          echo "The previous edition was retained and public/data/status.json records the failure."
          exit 1
      - name: Report healthy edition skip
        if: steps.refresh_gate.outputs.should_run != 'true'
        run: echo "Formal edition retained, or preparation window has not started; generation skipped."
