name: Daily news update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-news.yml"
  schedule:
    - cron: "7 7 * * *"
      timezone: "Asia/Shanghai"
    - cron: "37 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "即使当天日报已经健康，也强制重新生成"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: frontier-data-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Decide whether today's edition needs refresh
        id: refresh_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: >-
          python scripts/check_daily_refresh.py
          --status public/data/status.json
          --timezone Asia/Shanghai
          --event-name "$EVENT_NAME"
          --force "$FORCE_REFRESH"
          --required-schema 9
          --github-output "$GITHUB_OUTPUT"
      - name: Run unit tests
        if: steps.refresh_gate.outputs.should_run == 'true'
        run: python -m unittest discover -s tests -v
      - name: Collect, rank and summarize the latest 24 hours
        if: steps.refresh_gate.outputs.should_run == 'true'
        id: collect
        continue-on-error: true
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: >-
          python scripts/update_news.py
          --output public/data/news.json
          --archive-dir public/data/archive
          --archive-index public/data/archive/index.json
          --search-index public/data/archive/search-index.json
          --status-output public/data/status.json
          --stream-output public/data/stream.json
          --stream-status-output public/data/stream-status.json
          --research-output public/data/research.json
          --events-output public/data/events.json
          --weekly-output public/data/weekly.json
          --weekly-dir public/data/weekly
          --signals-output public/data/signals.json
          --feed-output public/feed.xml
      - name: Verify daily brief, full stream and research radar
        if: steps.refresh_gate.outputs.should_run == 'true' && steps.collect.outcome == 'success'
        run: >-
          python -c "import json; p=json.load(open('public/data/news.json', encoding='utf-8'));
          s=json.load(open('public/data/stream.json', encoding='utf-8'));
          r=json.load(open('public/data/research.json', encoding='utf-8'));
          e=json.load(open('public/data/events.json', encoding='utf-8'));
          w=json.load(open('public/data/weekly.json', encoding='utf-8'));
          a=json.load(open('public/data/signals.json', encoding='utf-8'));
          assert p.get('schemaVersion') == 9, p.get('schemaVersion');
          assert p.get('timezone') == 'Asia/Shanghai', p.get('timezone');
          assert p.get('selectionMethod') in ('rules', 'deepseek', 'openai'), p.get('selectionMethod');
          assert p.get('selectionStrategy') in ('rules-diverse', 'ai-ranked-rule-constrained'), p.get('selectionStrategy');
          assert p.get('selectionStatus') in ('ok', 'adjusted', 'relaxed', 'fallback', 'disabled', 'not-configured'), p.get('selectionStatus');
          assert p.get('translationStatus') in ('ok', 'partial', 'failed', 'disabled', 'not-configured'), p.get('translationStatus');
          assert p.get('historyAnalysisStatus') in ('ok', 'partial', 'rules', 'disabled', 'not-needed'), p.get('historyAnalysisStatus');
          assert len(p.get('items', [])) == 10, len(p.get('items', []));
          assert p.get('translatedItemCount') == sum(bool(x.get('translationProvider')) for x in p['items']);
          assert all(isinstance(x.get('keyFacts'), list) and x.get('sources') for x in p['items']);
          assert all(isinstance(x.get('historyContext'), dict) and x['historyContext'].get('outlook') for x in p['items']);
          assert all(x.get('eventId') and x.get('eventDossier') and x.get('evidenceMatrix') for x in p['items']);
          assert len(p.get('spotlightIds', [])) == 3 and len(set(p['spotlightIds'])) == 3;
          assert p.get('historyLinkedItemCount') == sum(x['historyContext'].get('status') == 'linked' for x in p['items']);
          assert s.get('itemCount') == len(s.get('items', [])) and s.get('itemCount', 0) > 0;
          assert r.get('itemCount') == len(r.get('items', []));
          assert e.get('eventCount') == len(e.get('items', []));
          assert w.get('weekId') and w.get('eventCount') == len(w.get('events', []));
          assert a.get('signalCount') == len(a.get('signals', []));
          assert __import__('pathlib').Path('public/feed.xml').exists();
          print('Validated edition', p.get('editionDate'), 'with 10 stories,', s['itemCount'], 'stream items and', r['itemCount'], 'papers')"
      - name: Commit edition, archive and public status
        if: always() && steps.refresh_gate.outputs.should_run == 'true'
        run: |
          git add -A -- public/data/news.json public/data/status.json public/data/stream.json public/data/stream-status.json public/data/research.json public/data/events.json public/data/weekly.json public/data/signals.json public/data/archive public/data/weekly public/feed.xml
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git config user.name "frontier-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh daily frontier brief and archive"
          for attempt in 1 2 3; do
            git fetch origin main --depth=20
            # During a rebase, "theirs" is this workflow's generated-data commit.
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "Unable to replay generated data onto the latest main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main changed during push; retrying publication ($attempt/3)"
            sleep "$((attempt * 2))"
          done
          echo "Unable to publish generated data after 3 attempts"
          exit 1
      - name: Send administrator email digest
        if: steps.refresh_gate.outputs.should_run == 'true' && steps.collect.outcome == 'success'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/send_digest.py --input public/data/news.json
      - name: Mark failed collection
        if: steps.refresh_gate.outputs.should_run == 'true' && steps.collect.outcome == 'failure'
        run: |
          echo "The previous edition was retained and public/data/status.json records the failure."
          exit 1
      - name: Report healthy edition skip
        if: steps.refresh_gate.outputs.should_run != 'true'
        run: echo "Today's healthy 10-item edition already exists; scheduled recovery run skipped."
