name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run unit tests
        run: python tests/run_offline.py
      - name: Check browser JavaScript syntax
        run: node --check public/assets/app.js
      - name: Test publication client and monitor behavior
        run: node --test --test-isolation=none tests/test_*.mjs
      - name: Build and validate a fixture edition
        run: >-
          python scripts/update_news.py
          --fixture tests/fixtures/articles.json
          --output /tmp/frontier-news.json
          --archive-dir /tmp/frontier-archive
          --archive-index /tmp/frontier-archive/index.json
          --search-index /tmp/frontier-archive/search-index.json
          --status-output /tmp/frontier-status.json
          --stream-output /tmp/frontier-stream.json
          --stream-status-output /tmp/frontier-stream-status.json
          --research-output /tmp/frontier-research.json
          --events-output /tmp/frontier-events.json
          --weekly-output /tmp/frontier-weekly.json
          --weekly-dir /tmp/frontier-weekly
          --signals-output /tmp/frontier-signals.json
          --research-fixture tests/fixtures/papers.json
          --feed-output /tmp/frontier-feed.xml
          --skip-ai
          --now 2026-07-16T00:00:00Z
      - name: Render fixture email digest
        run: python scripts/send_digest.py --input /tmp/frontier-news.json --dry-run
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned browser dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Test desktop, mobile, history, evidence and offline recovery
        env:
          FRONTIER_BROWSER_OUTPUT: ${{ runner.temp }}/frontier-browser-evidence
        run: npm run test:browser
      - name: Preserve browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-regressions
          path: ${{ runner.temp }}/frontier-browser-evidence
